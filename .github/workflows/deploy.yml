name: Deploy Nuxt App

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm run build
        env:
          DIRECTUS_URL: http://localhost:8055

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            set -e
            cd ~/apps/dolinaharmonii_frontend
            git pull origin main
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.local/share/pnpm:$PATH"
            pnpm install --frozen-lockfile
            # Build next to the live folder, then swap, so the running site is never half-deleted.
            rm -rf .output-new
            BUILD_OUTPUT_DIR=.output-new pnpm run build
            rm -rf .output-old
            [ -d .output ] && mv .output .output-old
            mv .output-new .output
            pm2 reload ecosystem.config.cjs --env production --update-env
